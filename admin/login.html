<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RHSA Admin | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="shortcut icon" href="../media/WhatsApp Image 2026-08-18 at 5.51.36 AM.jpeg" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A2647 0%, #1B3A5C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* :root {
            --primary-dark: #0A2647;
            --accent-orange: #E67E22;
            --text-muted: #6c757d;
            --border-light: #e2e8f0;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --error-red: #dc2626;
            --success-green: #10b981;
        } */

         :root {
            --primary-dark: #089546;
            --accent-green: #067A3A;
            --accent-lime: #9CC833;

            --text-dark: #16351F;
            --text-muted: #5F6F64;

            --border-light: #DCE9DF;
            --light-green: #F1F8F3;
            --lighter-green: #F7FBF8;

            --error-red: #dc2626;
            --success-green: #059669;

            --white: #ffffff;

            
        }


        .container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .form-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            padding: 2rem 2rem 2.5rem;
        }

        .logo-badge {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-badge h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .logo-badge span {
            color: var(--accent-orange);
        }
        .logo-badge p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .subhead {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        label i {
            color: var(--accent-orange);
            width: 18px;
        }
        .required-star {
            color: var(--accent-orange);
            margin-left: 4px;
        }

        input {
            padding: 12px 16px;
            border: 1.5px solid var(--border-light);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background-color: #fff;
            outline: none;
            width: 100%;
        }
        input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(230,126,34,0.15);
        }
        input.error {
            border-color: var(--error-red);
            background-color: #fff5f5;
        }

        .error-message {
            font-size: 0.7rem;
            color: var(--error-red);
            margin-top: 4px;
            display: none;
        }
        .error-message.show {
            display: block;
        }

        .btn-submit {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: var(--accent-lime);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(45, 243, 121, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.75rem;
            text-align: center;
            font-weight: 500;
            font-size: 0.85rem;
            display: none;
        }
        .status-msg.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .status-msg.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .footer-links a {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            margin-bottom: 1rem;
            transition: 0.2s;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 40px;
        }
        .back-link:hover {
            background: var(--accent-green);
        }
        hr {
            margin: 1rem 0;
            border: none;
            border-top: 1px solid var(--border-light);
        }
        .forgot-link {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
        }
        .forgot-link a {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
        }
        .forgot-link a:hover {
            color: var(--accent-green);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div class="form-card">
            <div class="logo-badge">
                <h2><span>RHSA</span> ADMIN</h2>
                <p>Students Alliance Admin Portal</p>
            </div>
            <h1>Welcome Back</h1>
            <p class="subhead">Login to access the admin dashboard</p>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address <span class="required-star">*</span></label>
                    <input type="email" id="email" name="email" placeholder="admin@example.com" autocomplete="email">
                    <div class="error-message" id="emailError">Please provide a valid email address.</div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password <span class="required-star">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                    <div class="error-message" id="passwordError">Password is required.</div>
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
                <div id="statusMessage" class="status-msg"></div>
            </form>

            <hr>
            <!-- <div class="footer-links">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div> -->
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('statusMessage');

        function validateEmail(email) {
            return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email);
        }

        function showError(elementId, isError) {
            const errorDiv = document.getElementById(elementId);
            if (errorDiv) {
                if (isError) errorDiv.classList.add('show');
                else errorDiv.classList.remove('show');
            }
        }

        function markError(fieldId, isError) {
            const field = document.getElementById(fieldId);
            if (field) {
                if (isError) field.classList.add('error');
                else field.classList.remove('error');
            }
        }

        function validateForm(data) {
            let isValid = true;

            if (!data.email || !validateEmail(data.email)) {
                showError('emailError', true);
                markError('email', true);
                isValid = false;
            } else {
                showError('emailError', false);
                markError('email', false);
            }

            if (!data.password || data.password.trim() === "") {
                showError('passwordError', true);
                markError('password', true);
                isValid = false;
            } else {
                showError('passwordError', false);
                markError('password', false);
            }

            return isValid;
        }

        function gatherFormData() {
            return {
                email: document.getElementById('email').value.trim().toLowerCase(),
                password: document.getElementById('password').value
            };
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusDiv.className = 'status-msg';
            statusDiv.style.display = 'none';

            const formData = gatherFormData();

            if (!validateForm(formData)) {
                statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Please enter valid email and password.';
                statusDiv.className = 'status-msg error';
                statusDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Logging in...';

            try {
                const response = await fetch('https://batkoh-backend.onrender.com/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData),
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Login successful! Redirecting to dashboard...';
                    statusDiv.className = 'status-msg success';
                    statusDiv.style.display = 'block';
                    
                    // Store token or admin data if needed
                    if (result.token) {
                        localStorage.setItem('adminToken', result.token);
                    }
                    if (result.admin) {
                        localStorage.setItem('adminData', JSON.stringify(result.admin));
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    let errMsg = result.message || 'Invalid email or password.';
                    if (result.errors && Array.isArray(result.errors)) {
                        errMsg = result.errors.map(e => e.msg || e.message).join(', ');
                    }
                    statusDiv.innerHTML = `<i class="fas fa-times-circle"></i> ${errMsg}`;
                    statusDiv.className = 'status-msg error';
                    statusDiv.style.display = 'block';
                }
            } catch (err) {
                statusDiv.innerHTML = '<i class="fas fa-plug"></i> Network error: Could not connect to server. Make sure backend is running at http://localhost:5000';
                statusDiv.className = 'status-msg error';
                statusDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });

        // Clear errors on input
        const emailField = document.getElementById('email');
        const passwordField = document.getElementById('password');
        
        emailField.addEventListener('input', () => {
            showError('emailError', false);
            markError('email', false);
        });
        
        passwordField.addEventListener('input', () => {
            showError('passwordError', false);
            markError('password', false);
        });
    </script>
</body>
</html>
